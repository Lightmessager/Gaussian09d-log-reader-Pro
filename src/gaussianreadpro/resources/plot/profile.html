<!doctype html><html><head><meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' qrc: 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src data: blob:; worker-src blob:; connect-src 'none';">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>GaussianReaderPro energy profile</title>
<link rel="stylesheet" href="replica.css">
<script src="qrc:///qtwebchannel/qwebchannel.js"></script>
<script src="vendor/plotly.min.js"></script><script src="inspector_view.js" defer></script><script src="replica_controls.js" defer></script><script src="profile.js" defer></script>
</head><body><div id="workbench">
<main id="main-column">
 <div id="profile-toolbar" role="toolbar" aria-label="Energy profile">
  <div id="dimension-controls" class="control-group"><button data-mode="2d" aria-pressed="false">2D</button><button data-mode="3d" aria-pressed="false">3D</button></div>
  <div id="path-controls" class="control-group" aria-label="Path visibility"></div>
  <button id="compare-control" class="profile-control"><span class="tool-icon" data-icon="compare"></span><span id="compare-label">Compare</span></button>
  <button id="reset-control" class="profile-control"><span class="tool-icon" data-icon="reset"></span><span id="reset-label">Reset camera</span></button>
  <button id="export-control" class="profile-control"><span class="tool-icon" data-icon="export"></span><span id="export-label">Export</span></button>
 </div>
 <div id="path-picker" hidden role="dialog" aria-label="Reaction paths"><div id="path-picker-list"></div></div>
 <div id="notice" role="status"></div><div id="plot" tabindex="-1" aria-label="Energy profile chart"></div>
 <div id="accessible-points" role="listbox" aria-label="Energy profile points"></div>
 <div id="keyboard-status" role="status" aria-live="polite"></div>
 <button id="show-details" hidden>Details / 详情</button>
 <div id="orientation-placeholder" aria-label="Camera orientation"></div>
 <div id="bottom-tools" class="control-group" role="toolbar" aria-label="Camera controls"><button data-drag="orbit"><span class="tool-icon" data-icon="orbit"></span><span id="orbit-label">Orbit</span></button><button data-drag="pan"><span class="tool-icon" data-icon="pan"></span><span id="pan-label">Pan</span></button><button id="zoom-control"><span class="tool-icon" data-icon="zoom"></span><span id="zoom-label">Zoom</span></button><button id="fit-control"><span class="tool-icon" data-icon="fit"></span><span id="fit-label">Fit</span></button></div>
 <div id="operation-hint">Drag to orbit · Scroll to zoom</div>
</main>
<aside id="inspector-shell" aria-label="Selected node details">
 <h2 id="inspector-heading"><span id="selected-title">Selected · —</span><button id="details-menu" aria-label="Options">···</button></h2>
 <div id="inspector-menu" hidden></div><button id="pair-steps" hidden></button>
 <div id="molecule-placeholder"><div id="molecule-stage"></div><select id="structure-source" hidden></select><div id="structure-status" role="status">—</div><div id="structure-provenance"></div></div>
 <dl id="details-fields"></dl>
 <div id="source-list" hidden></div>
 <section id="overview-placeholder"><h3 id="overview-title" class="detail-section-title">Two-path energy profile (2D view)</h3><svg id="overview-chart" role="img" aria-label="Energy profile overview"></svg></section>
 <section id="table-placeholder"><h3 id="table-title" class="detail-section-title">Key energies</h3><div class="energy-table-scroll"><table id="key-energy-table"></table></div></section>
</aside></div></body></html>
