[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "gaussianreaderpro"
version = "2.0.0"
description = "GaussianReaderPro Gaussian log analysis desktop workbench"
requires-python = ">=3.12,<3.13"
dependencies = ["PySide6==6.12.0", "matplotlib==3.11.2"]

[project.optional-dependencies]
dev = ["plotly==7.1.0", "pyinstaller==6.22.3", "pytest>=8,<10"]

[project.scripts]
gaussianreaderpro = "gaussianreadpro.__main__:main"
gaussianreadpro = "gaussianreadpro.__main__:main"
gaussianreadpro-s0 = "gaussianreadpro.prototype:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
gaussianreadpro = ["resources/plot/*.html", "resources/plot/*.js", "resources/plot/*.css", "resources/plot/vendor/*", "resources/locales/*.json", "resources/themes/*.json", "resources/icons/*.svg", "resources/icons/*.png"]

[tool.pytest.ini_options]
testpaths = ["tests"]
